<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БОТОГРАД — Интенсивный Тайминг-Экшен</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #login {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 15px;
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a1a 70%);
        }
        #login h1 {
            font-size: 3.5em;
            background: linear-gradient(90deg, #ff4444, #ffff44, #44ff44, #44ffff, #4444ff, #ff44ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow { from { filter: drop-shadow(0 0 10px #ff4444); } to { filter: drop-shadow(0 0 30px #4444ff); } }
        #login input {
            padding: 14px 28px;
            font-size: 1.1em;
            border: 2px solid #44ffff;
            border-radius: 10px;
            background: rgba(68, 255, 255, 0.05);
            color: #fff;
            width: 300px;
            outline: none;
        }
        #login input:focus { border-color: #ff44ff; box-shadow: 0 0 15px #ff44ff44; }
        #login button {
            padding: 14px 50px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff4444, #ff44ff);
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #login button:hover { transform: scale(1.05); box-shadow: 0 0 30px #ff44ff88; }

        #game { display: none; height: 100vh; }
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: rgba(0,0,0,0.6);
            border-bottom: 2px solid #333;
            height: 50px;
        }
        #top-bar .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.95em;
        }
        #top-bar .stat .val { font-weight: bold; color: #44ffff; }

        #timers {
            display: flex;
            gap: 10px;
            padding: 6px 15px;
            background: rgba(0,0,0,0.4);
            height: 36px;
        }
        .timer-bar {
            flex: 1;
            background: #1a1a2e;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .timer-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s linear;
        }
        .timer-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75em;
            font-weight: bold;
            text-shadow: 0 0 4px #000;
        }

        #main { display: flex; height: calc(100vh - 86px); }
        #canvas-wrap { flex: 1; position: relative; }
        #canvas-wrap canvas { width: 100%; height: 100%; display: block; }

        #sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.5);
            border-left: 2px solid #333;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 8px;
            border-bottom: 1px solid #333;
        }
        .ctrl-btn {
            padding: 10px 4px;
            font-size: 0.85em;
            border: 1px solid #444;
            border-radius: 6px;
            background: rgba(68,255,255,0.08);
            color: #fff;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .ctrl-btn:hover:not(:disabled) { background: rgba(68,255,255,0.25); border-color: #44ffff; }
        .ctrl-btn:disabled { opacity: 0.35; cursor: default; }
        .ctrl-btn .cd { font-size: 0.7em; color: #ff4444; display: block; }

        #buffs {
            display: flex;
            gap: 4px;
            padding: 6px 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid #333;
            min-height: 32px;
        }
        .buff-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            font-size: 1.1em;
            position: relative;
        }
        .buff-icon .buff-timer {
            position: absolute;
            bottom: -2px;
            font-size: 0.5em;
            color: #ffff44;
        }

        #boss-bar {
            display: none;
            padding: 6px 8px;
            border-bottom: 1px solid #ff4444;
            background: rgba(255,0,0,0.1);
        }
        #boss-bar.show { display: block; }
        #boss-bar .boss-hp-bg {
            width: 100%;
            height: 16px;
            background: #1a0a0a;
            border-radius: 8px;
            overflow: hidden;
        }
        #boss-bar .boss-hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff8844);
            transition: width 0.2s;
        }
        #boss-bar .boss-label { font-size: 0.8em; text-align: center; margin-top: 2px; color: #ff8844; }

        #log {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
            font-size: 0.8em;
        }
        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .log-STATUS { color: #44ffff; }
        .log-SPAWN { color: #44ff44; }
        .log-PICKUP { color: #ffff44; }
        .log-DAMAGE { color: #ff4444; }
        .log-HEAL { color: #44ff44; }
        .log-BUFF { color: #ff44ff; }
        .log-DEBUFF { color: #ff8844; }
        .log-COMBO { color: #ff4444; font-weight: bold; }
        .log-CRIT { color: #ffff00; font-weight: bold; }
        .log-WAVE { color: #44ffff; font-weight: bold; }
        .log-BOSS { color: #ff4444; font-weight: bold; font-size: 1.1em; }
        .log-KILL { color: #ff44ff; font-weight: bold; }
        .log-LEVELUP { color: #ffff44; font-weight: bold; font-size: 1.1em; }
        .log-QUEST { color: #44ff44; }
        .log-TRADE { color: #ffff44; }
        .log-LOOT { color: #ff44ff; }
        .log-EVENT { color: #ff8844; font-weight: bold; }
        .log-SYNC { color: #666; }
        .log-ERROR { color: #ff4444; }
        .log-SYSTEM { color: #888; font-style: italic; }

        #combo-display {
            display: none;
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            font-weight: bold;
            color: #ff4444;
            text-shadow: 0 0 30px #ff4444, 0 0 60px #ff4444;
            animation: comboPulse 0.5s ease-out;
            pointer-events: none;
            z-index: 100;
        }
        @keyframes comboPulse { from { transform: translateX(-50%) scale(1.5); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }

        #event-flash {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 100;
            pointer-events: none;
            animation: flashIn 0.4s ease-out;
        }
        @keyframes flashIn { from { transform: translate(-50%, -50%) scale(2); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="login">
        <h1>БОТОГРАД</h1>
        <p style="color:#888">Интенсивный тайминг-экшен с роботами</p>
        <input id="inp-id" placeholder="ID игрока">
        <input id="inp-name" placeholder="Имя (опционально)">
        <button onclick="join()">ВОЙТИ</button>
    </div>

    <div id="game">
        <div id="top-bar">
            <div class="stat">🤖 <span id="s-name" class="val"></span></div>
            <div class="stat">Ур.<span id="s-level" class="val">1</span></div>
            <div class="stat">⭐<span id="s-xp" class="val">0</span></div>
            <div class="stat">❤️<span id="s-hp" class="val">100</span>/<span id="s-maxhp">100</span></div>
            <div class="stat">🛡️<span id="s-shield" class="val">0</span></div>
            <div class="stat">💎<span id="s-res" class="val">0</span></div>
            <div class="stat">🔥<span id="s-combo" class="val">0</span>x</div>
            <div class="stat">⭐<span id="s-prestige" class="val">0</span></div>
            <div class="stat">🗝️<span id="s-keys" class="val">0</span></div>
        </div>

        <div id="timers">
            <div class="timer-bar"><div class="timer-fill" id="t-wave" style="background:#44ffff;width:100%"></div><div class="timer-label">Волна</div></div>
            <div class="timer-bar"><div class="timer-fill" id="t-event" style="background:#ff8844;width:100%"></div><div class="timer-label">Эвент</div></div>
            <div class="timer-bar"><div class="timer-fill" id="t-boss" style="background:#ff4444;width:100%"></div><div class="timer-label">Босс</div></div>
            <div class="timer-bar"><div class="timer-fill" id="t-super" style="background:#ff44ff;width:100%"></div><div class="timer-label">Супер</div></div>
        </div>

        <div id="main">
            <div id="canvas-wrap">
                <canvas id="c"></canvas>
            </div>
            <div id="sidebar">
                <div id="controls">
                    <button class="ctrl-btn" onclick="doAction('move')">🏃 Движение</button>
                    <button class="ctrl-btn" onclick="doAction('attack')" id="btn-atk">⚔️ Атака</button>
                    <button class="ctrl-btn" onclick="doAction('chest')">📦 Сундук</button>
                </div>
                <div id="buffs"></div>
                <div id="boss-bar">
                    <div class="boss-hp-bg"><div class="boss-hp-fill" id="boss-hp"></div></div>
                    <div class="boss-label" id="boss-label">БОСС</div>
                </div>
                <div id="log"></div>
            </div>
        </div>
    </div>

    <div id="combo-display"></div>
    <div id="event-flash"></div>

    <script>
        /**
         * @fileoverview Клиент Ботоград — Canvas 2D, частицы, UI, сообщения
         * @see CONCEPT.md
         */

        const S = {
            ws: null, pid: null, player: null, bonuses: [], boss: null,
            time: {}, particles: [], canvas: null, ctx: null,
            timers: { wave: 10000, event: 30000, boss: 60000, super: 120000 },
            timerStarts: {}, screenShake: 0
        };

        function join() {
            const id = document.getElementById('inp-id').value.trim();
            const name = document.getElementById('inp-name').value.trim();
            if (!id) return alert('Введите ID!');
            S.pid = id;

            S.ws = new WebSocket(`ws://${location.hostname}:3001`);
            S.ws.onopen = () => S.ws.send(JSON.stringify({ type: 'join', id, name }));
            S.ws.onmessage = e => handleMsg(JSON.parse(e.data));
        }

        function handleMsg(m) {
            switch (m.type) {
                case 'joined':
                    S.player = m.data;
                    S.timerStarts.wave = Date.now();
                    S.timerStarts.event = Date.now();
                    S.timerStarts.boss = Date.now();
                    S.timerStarts.super = Date.now();
                    showGame();
                    addLog('SYSTEM', `Добро пожаловать, ${S.player.name}! Класс: ${S.player.className}`);
                    break;
                case 'playerUpdate': S.player = m.data; updateUI(); break;
                case 'bonuses': S.bonuses = m.data; break;
                case 'wave':
                    S.bonuses.push(...m.data.bonuses);
                    S.timerStarts.wave = Date.now();
                    addLog('WAVE', `🌊 Волна #${m.data.waveNumber}`);
                    break;
                case 'event':
                    S.timerStarts.event = Date.now();
                    showFlash(m.data.name, m.data.negative ? '#ff4444' : '#44ff44');
                    addLog('EVENT', m.data.name);
                    break;
                case 'boss':
                    S.boss = m.data;
                    S.timerStarts.boss = Date.now();
                    document.getElementById('boss-bar').classList.add('show');
                    addLog('BOSS', `💀 БОСС #${m.data.id} ПРИШЁЛ!`);
                    shake(8);
                    break;
                case 'bossKill':
                    S.boss = null;
                    document.getElementById('boss-bar').classList.remove('show');
                    showFlash('БОСС УБИТ!', '#ff44ff');
                    shake(12);
                    break;
                case 'superBonus':
                    S.bonuses.push(m.data);
                    S.timerStarts.super = Date.now();
                    showFlash('🌟 СУПЕР-БОНУС!', '#ff44ff');
                    break;
                case 'log':
                    addLog(m.data.type, m.data.message);
                    if (m.data.type === 'COMBO' && m.data.data?.combo >= 3) showCombo(m.data.data.combo);
                    break;
                case 'leaderboard': break;
            }
        }

        function showGame() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            S.canvas = document.getElementById('c');
            S.ctx = S.canvas.getContext('2d');
            resize();
            window.addEventListener('resize', resize);
            updateUI();
            requestAnimationFrame(loop);
            setInterval(() => { if (S.ws?.readyState === 1) S.ws.send(JSON.stringify({ type: 'sync' })); }, 5000);
        }

        function resize() {
            S.canvas.width = S.canvas.parentElement.clientWidth;
            S.canvas.height = S.canvas.parentElement.clientHeight;
        }

        function updateUI() {
            const p = S.player;
            if (!p) return;
            document.getElementById('s-name').textContent = `${p.className} ${p.name}`;
            document.getElementById('s-level').textContent = p.level;
            document.getElementById('s-xp').textContent = `${p.xp}/${p.level * 100}`;
            document.getElementById('s-hp').textContent = p.hp;
            document.getElementById('s-maxhp').textContent = p.maxHp;
            document.getElementById('s-shield').textContent = p.shield;
            document.getElementById('s-res').textContent = p.resources;
            document.getElementById('s-combo').textContent = p.combo;
            document.getElementById('s-prestige').textContent = p.prestige;
            document.getElementById('s-keys').textContent = p.keys || 0;

            // Buffs
            const buffsEl = document.getElementById('buffs');
            buffsEl.innerHTML = '';
            for (const [k, v] of Object.entries(p.buffs || {})) {
                if (v.until > Date.now()) {
                    const sec = Math.ceil((v.until - Date.now()) / 1000);
                    const icons = { speed: '⚡', crit: '💥', super: '🌟', magnet: '🧲', luck: '🍀' };
                    buffsEl.innerHTML += `<div class="buff-icon">${icons[k] || '✨'}<span class="buff-timer">${sec}s</span></div>`;
                }
            }

            // Boss HP
            if (S.boss) {
                const pct = Math.max(0, S.boss.hp / S.boss.maxHp * 100);
                document.getElementById('boss-hp').style.width = pct + '%';
                document.getElementById('boss-label').textContent = `БОСС #${S.boss.id} — HP: ${S.boss.hp}/${S.boss.maxHp}`;
            }
        }

        function doAction(type) {
            if (!S.ws || S.ws.readyState !== 1) return;
            let action = { type };
            if (type === 'move') action.target = { x: Math.random() * 100, y: Math.random() * 100 };
            if (type === 'attack' && !S.boss) return addLog('ERROR', 'Нет босса!');
            S.ws.send(JSON.stringify({ type: 'action', action }));
        }

        // Canvas клики — подбор бонусов
        document.addEventListener('click', e => {
            if (!S.canvas) return;
            const rect = S.canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) / rect.width * 100;
            const my = (e.clientY - rect.top) / rect.height * 100;

            for (let i = S.bonuses.length - 1; i >= 0; i--) {
                const b = S.bonuses[i];
                const dx = mx - b.x, dy = my - b.y;
                if (Math.sqrt(dx * dx + dy * dy) < 5) {
                    S.ws.send(JSON.stringify({ type: 'action', action: { type: 'pickup', bonusId: b.id } }));
                    S.bonuses.splice(i, 1);
                    spawnParticles(b.x, b.y, b.type.icon, 8);
                    break;
                }
            }
        });

        function addLog(type, msg) {
            const log = document.getElementById('log');
            const el = document.createElement('div');
            el.className = `log-entry log-${type}`;
            el.textContent = `[${type}] ${msg}`;
            log.prepend(el);
            while (log.children.length > 80) log.removeChild(log.lastChild);
        }

        function showCombo(n) {
            const el = document.getElementById('combo-display');
            el.textContent = `${n}x КОМБО!`;
            el.style.display = 'block';
            el.style.animation = 'none';
            el.offsetHeight;
            el.style.animation = 'comboPulse 0.5s ease-out';
            setTimeout(() => el.style.display = 'none', 1500);
        }

        function showFlash(text, color) {
            const el = document.getElementById('event-flash');
            el.textContent = text;
            el.style.color = color;
            el.style.border = `2px solid ${color}`;
            el.style.background = `${color}22`;
            el.style.display = 'block';
            el.style.animation = 'none';
            el.offsetHeight;
            el.style.animation = 'flashIn 0.4s ease-out';
            setTimeout(() => el.style.display = 'none', 2500);
        }

        function shake(intensity) { S.screenShake = intensity; }

        // === PARTICLES ===
        function spawnParticles(x, y, emoji, count) {
            for (let i = 0; i < count; i++) {
                S.particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3,
                    life: 1,
                    emoji,
                    size: 12 + Math.random() * 10
                });
            }
        }

        // === RENDER LOOP ===
        function loop() {
            render();
            requestAnimationFrame(loop);
        }

        function render() {
            const ctx = S.ctx;
            const W = S.canvas.width;
            const H = S.canvas.height;

            // Shake
            ctx.save();
            if (S.screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * S.screenShake, (Math.random() - 0.5) * S.screenShake);
                S.screenShake *= 0.9;
                if (S.screenShake < 0.5) S.screenShake = 0;
            }

            // Background gradient — always dark/intense
            const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.7);
            bg.addColorStop(0, '#1a0a2e');
            bg.addColorStop(0.5, '#0f0a1a');
            bg.addColorStop(1, '#050510');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // Grid
            ctx.strokeStyle = 'rgba(68,255,255,0.04)';
            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
            for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

            // Floating background particles
            const t = Date.now() * 0.001;
            ctx.fillStyle = 'rgba(68,255,255,0.15)';
            for (let i = 0; i < 30; i++) {
                const px = (Math.sin(t + i * 2.1) * 0.5 + 0.5) * W;
                const py = (Math.cos(t * 0.7 + i * 1.3) * 0.5 + 0.5) * H;
                ctx.beginPath();
                ctx.arc(px, py, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Bonuses
            for (const b of S.bonuses) {
                const bx = b.x / 100 * W;
                const by = b.y / 100 * H;
                const pulse = 1 + Math.sin(t * 4 + b.id) * 0.15;
                const sz = (b.isSuper ? 28 : 20) * pulse;

                // Glow
                ctx.shadowColor = b.isSuper ? '#ff44ff' : '#44ffff';
                ctx.shadowBlur = b.isSuper ? 25 : 12;

                // Background circle
                ctx.fillStyle = b.isSuper ? 'rgba(255,68,255,0.25)' : 'rgba(68,255,255,0.15)';
                ctx.beginPath();
                ctx.arc(bx, by, sz * 0.9, 0, Math.PI * 2);
                ctx.fill();

                // Emoji
                ctx.shadowBlur = 0;
                ctx.font = `${sz}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.type.icon, bx, by);
            }
            ctx.shadowBlur = 0;

            // Boss
            if (S.boss) {
                const bx = S.boss.x / 100 * W;
                const by = S.boss.y / 100 * H + 50;
                const bossPulse = 1 + Math.sin(t * 3) * 0.08;

                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 30;
                ctx.fillStyle = '#ff444444';
                ctx.beginPath();
                ctx.arc(bx, by, 45 * bossPulse, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.font = '40px serif';
                ctx.textAlign = 'center';
                ctx.fillText('💀', bx, by);

                ctx.font = 'bold 12px monospace';
                ctx.fillStyle = '#ff4444';
                ctx.fillText(`HP: ${S.boss.hp}/${S.boss.maxHp}`, bx, by + 35);
            }

            // Player robot
            if (S.player) {
                const px = S.player.position.x / 100 * W;
                const py = S.player.position.y / 100 * H;
                const col = S.player.classColor;
                const bob = Math.sin(t * 3) * 4;

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(px, py + 30, 20, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Glow
                ctx.shadowColor = col;
                ctx.shadowBlur = 20;

                // Body
                ctx.fillStyle = col;
                ctx.beginPath();
                ctx.roundRect(px - 18, py - 22 + bob, 36, 38, 6);
                ctx.fill();

                // Head
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(px, py - 30 + bob, 14, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = col;
                ctx.beginPath();
                ctx.arc(px - 5, py - 32 + bob, 3, 0, Math.PI * 2);
                ctx.arc(px + 5, py - 32 + bob, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;

                // Name + HP bar
                ctx.font = 'bold 11px monospace';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.fillText(S.player.name, px, py - 48 + bob);

                ctx.fillStyle = '#333';
                ctx.fillRect(px - 20, py + 22, 40, 5);
                ctx.fillStyle = S.player.hp > S.player.maxHp * 0.3 ? '#44ff44' : '#ff4444';
                ctx.fillRect(px - 20, py + 22, 40 * Math.max(0, S.player.hp / S.player.maxHp), 5);

                // Shield bar
                if (S.player.shield > 0) {
                    ctx.fillStyle = '#333';
                    ctx.fillRect(px - 20, py + 29, 40, 4);
                    ctx.fillStyle = '#4488ff';
                    ctx.fillRect(px - 20, py + 29, 40 * Math.min(1, S.player.shield / 50), 4);
                }
            }

            // Particles
            for (let i = S.particles.length - 1; i >= 0; i--) {
                const p = S.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) { S.particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life;
                ctx.font = `${p.size * p.life}px serif`;
                ctx.textAlign = 'center';
                ctx.fillText(p.emoji, p.x / 100 * W, p.y / 100 * H);
                ctx.globalAlpha = 1;
            }

            ctx.restore();

            // Timer bars
            updateTimerBars();
        }

        function updateTimerBars() {
            const now = Date.now();
            const set = (id, max) => {
                const elapsed = now - S.timerStarts[id];
                const pct = Math.max(0, 100 - (elapsed / max * 100));
                document.getElementById(`t-${id}`).style.width = pct + '%';
            };
            set('wave', 10000);
            set('event', 30000);
            set('boss', 60000);
            set('super', 120000);
        }
    </script>
</body>
</html>
